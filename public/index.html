<body>
  <header class="topbar">
    <div class="brand"><span class="mark">FPL</span><span><strong>Aqua FPL Advisor</strong><small>Squad & transfer intelligence</small></span></div>
    <nav class="topnav" aria-label="Đi tới nội dung"><a href="#builder">Đội hình</a><a href="#leagues">League</a><a href="#news">Tin FPL</a><a href="#history">Lịch sử</a></nav>
    <span class="live-status" id="apiStatus">Sẵn sàng kết nối</span>
  </header>
  <main class="page">
    <section class="panel connect compact-connect">
      <div class="connect-form"><label class="field"><span>Fantasy Entry ID</span><input id="entryId" inputmode="numeric" autocomplete="off" placeholder="Ví dụ: 120245"></label><label class="field"><span>Khoảng phân tích</span><select id="horizon"><option value="2">2 Gameweek</option><option value="3">3 Gameweek</option><option value="4">4 Gameweek</option><option value="5" selected>5 Gameweek</option><option value="6">6 Gameweek</option><option value="8">8 Gameweek</option></select></label><button class="btn primary" id="analyze">Phân tích đội</button></div><div class="sync hidden" id="syncNote"></div>
    </section>
    <div id="app" class="workspace"><section class="panel empty"><div><h2>Nhập Fantasy ID để bắt đầu</h2><p>Đội hình gần nhất sẽ được tải sau khi Gameweek đã qua deadline.</p></div></section></div>
  </main>
  <script>
  (()=>{"use strict";
    const app=document.getElementById("app"),entryInput=document.getElementById("entryId"),horizonInput=document.getElementById("horizon"),analyzeButton=document.getElementById("analyze"),syncNote=document.getElementById("syncNote"),apiStatus=document.getElementById("apiStatus");
    let snapshot=null,chat=[],chatLoading=false,refreshTimer=null,manualFreeTransfers=null,advisorMode="quick",plannedSquad=[],plannedMoves=[],planBudgetLimit=0,planTeamLimit=3,planNotice="",trackerGw="all",builderSelected=null,builderArrange=null,builderQuery="",builderPosition="ALL",builderMode=null,leagueSelected=null,builderGw="builder",builderChip="none",marketDetails={},marketDetailsLoading=false;
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const number=value=>value===null||value===undefined||value===""?"–":Number(value).toLocaleString("vi-VN");
    const money=value=>value===null||value===undefined?"–":`£${(Number(value)/10).toFixed(1)}m`;
    const seasonYear=name=>Number(String(name||"").match(/\d{4}/)?.[0]||0);
    const effectiveFt=data=>data?.gameweek?.freeTransfers!==null&&data?.gameweek?.freeTransfers!==undefined&&data?.gameweek?.freeTransfers!==""&&Number.isInteger(Number(data.gameweek.freeTransfers))?Number(data.gameweek.freeTransfers):manualFreeTransfers!==null&&manualFreeTransfers!==undefined&&Number.isInteger(Number(manualFreeTransfers))?Number(manualFreeTransfers):null;
    function ftStorageKey(data){return`aqua-fpl-advisor-ft-${data?.entry?.id||"entry"}-gw${data?.gameweek?.nextEvent||"next"}`}
    function loadManualFt(data){if(data?.gameweek?.freeTransfers!==null&&data?.gameweek?.freeTransfers!==undefined){manualFreeTransfers=null;return}try{const saved=localStorage.getItem(ftStorageKey(data));manualFreeTransfers=saved!==null&&saved!==""?Number(saved):null}catch(_){manualFreeTransfers=null}}
    function ftCard(data){const gw=data.gameweek||{},direct=effectiveFt(data);if(gw.freeTransfers!==null&&gw.freeTransfers!==undefined)return`<strong>${number(direct)}</strong><small>Lấy trực tiếp từ FPL API · tối đa ${number(gw.freeTransferCap)}</small>`;return`<select class="ft-select" id="manualFt" aria-label="Nhập số Free Transfer"><option value="" ${direct===null?"selected":""}>Nhập số FT</option>${Array.from({length:Number(gw.freeTransferCap||5)+1},(_,value)=>`<option value="${value}" ${direct===value?"selected":""}>${value} FT</option>`).join("")}</select><small>FPL công khai chưa cung cấp · ước tính tham khảo ${number(gw.freeTransfersEstimate)}</small>`}
    function squadBasisNote(data){const gw=data.gameweek||{};return gw.squadBasis==="previous_gameweek_before_freehit"?`<p class="freehit-note"><strong>Free Hit đang hoạt động ở GW${number(gw.currentPicksEvent)}.</strong> Phân tích chuyển nhượng sử dụng đội hình gốc của GW${number(gw.advicePicksEvent)}, là đội sẽ được khôi phục sau Free Hit.</p>`:""}
    function risk(player){const chance=player?.chanceNextRound;if(chance!==null&&chance!==undefined&&Number(chance)<=25)return"high";if(chance!==null&&chance!==undefined&&Number(chance)<100)return"medium";return player?.status&&player.status!=="a"?"medium":""}
    function fixturePills(player){const fixtures=(player?.fixtures||[]).slice(0,5);return fixtures.length?fixtures.map(fixture=>{const fdr=Number(fixture.difficulty)||3,level=fdr<=2?"easy":fdr>=4?"hard":"",opponent=fixture.opponent?.shortName||"–";return`<span class="fixture ${level}" title="GW${fixture.event} · FDR ${fdr}">${fixture.home?"H":"A"} ${esc(opponent)}</span>`}).join(""):'<span class="fixture">–</span>'}
    function squadView(data){const groups=[{key:"GKP",label:"Thủ môn"},{key:"DEF",label:"Hậu vệ"},{key:"MID",label:"Tiền vệ"},{key:"FWD",label:"Tiền đạo"}];return`<div class="pitch">${groups.map(group=>{const picks=(data.squad||[]).filter(pick=>pick.player?.position===group.key);return`<div class="position-row"><span class="position-label">${group.label}</span><div class="players">${picks.map(pick=>{const player=pick.player||{},level=risk(player),role=pick.is_captain?"C":pick.is_vice_captain?"V":Number(pick.position)>11?"DỰ BỊ":"";return`<article class="player ${level?`risk-${level}`:""}">${level?'<i class="alert-dot" aria-label="Có cảnh báo"></i>':""}<header><h4>${esc(player.webName||"–")}</h4>${role?`<span class="role">${role}</span>`:""}</header><p>${esc(player.team?.shortName||"–")} · ${money(player.nowCost)} · Form ${esc(player.form??"–")}</p><div class="fixtures">${fixturePills(player)}</div></article>`}).join("")}</div></div>`}).join("")}</div>`}
    function filteredMoves(data){const moves=data.transferSuggestions||[];if(mode==="safe")return moves.filter(move=>move.confidence==="high"||risk(move.outPlayer)).slice(0,3);if(mode==="aggressive")return moves.slice(0,6);return moves.filter(move=>Number(move.projectedGain)>=1).slice(0,4)}
    function transferView(data){const moves=filteredMoves(data),free=effectiveFt(data),urgent=(data.news||[]).some(item=>item.isOwned&&item.severity==="high");if(!moves.length&&!urgent)return'<div class="roll"><strong>Ưu tiên giữ free transfer.</strong><br>Chưa có nâng cấp đủ rõ trong ngân sách và khoảng lịch đã chọn. Kiểm tra lại sát deadline.</div>';return`${free===null?'<p class="freehit-note"><strong>Chưa có số Free Transfer.</strong> Hãy nhập FT ở thẻ phía trên để phân loại phương án miễn phí và phương án cần trừ điểm.</p>':""}<div class="transfers">${moves.map((move,index)=>{const out=move.outPlayer||{},incoming=move.inPlayer||{},label=free===null?"Chờ nhập FT":index<free?index===0?"Ưu tiên FT 1":`Free transfer ${index+1}`:`Hit -${(index-free+1)*4}`;return`<article class="transfer"><div class="transfer-player"><span>Bán ra</span><strong>${esc(out.webName||"–")}</strong><small>${esc(out.team?.shortName||"–")} · ${money(out.nowCost)}</small></div><div class="arrow">→</div><div class="transfer-player"><span>Mua vào</span><strong>${esc(incoming.webName||"–")}</strong><small>${esc(incoming.team?.shortName||"–")} · ${money(incoming.nowCost)}</small></div><div class="transfer-result"><b>+${esc(move.projectedGain)} pts</b><small>${esc(label)} · Bank còn ${money(move.bankAfter)}</small><span class="reason">${esc(move.reason||"Điểm dự phóng tốt hơn")}</span></div></article>`}).join("")}</div><p class="note">Mỗi phương án được đánh giá độc lập theo form, expected points, khả năng ra sân và FDR trong ${data.gameweek?.horizon||5} vòng. Giá bán thực tế có thể khác giá hiện tại.</p>`}
    function newsView(data){const items=data.news||[];return items.length?`<div class="news">${items.map(item=>`<article class="news-item ${esc(item.severity||"info")} ${item.isOwned?"owned":""}"><div class="news-meta"><span>${item.type==="availability"?"Tình trạng":item.type==="transfer"?"Xu hướng mua":"Thị trường"}</span>${item.isOwned?"<b>Trong đội hình</b>":""}</div><h4>${esc(item.headline||"Cập nhật FPL")}</h4><p>${esc(item.detail||"")}</p></article>`).join("")}</div>`:'<p class="note">Không có cảnh báo mới từ FPL.</p>'}
    function trackerView(data){const rows=data.history?.gameweeks||[],max=Math.max(1,...rows.map(row=>Number(row.points)||0)),past=(data.history?.pastSeasons||[]).slice().sort((a,b)=>seasonYear(b.season_name)-seasonYear(a.season_name)),events=[...(data.chips||[]).map(chip=>({gw:chip.event,label:`Dùng chip ${chip.name}`,meta:"Chip"})),...(data.history?.transfers||[]).slice(-5).reverse().map(move=>({gw:move.event,label:`${move.elementOut?.webName||"–"} → ${move.elementIn?.webName||"–"}`,meta:money(move.element_in_cost)}))].sort((a,b)=>Number(b.gw)-Number(a.gw)).slice(0,6);return`<div class="tracker"><div><div class="gw-chart">${rows.map(row=>`<div class="bar" title="GW${row.event}: ${row.points} điểm · Overall #${number(row.overall_rank)}"><i style="height:${Math.max(4,Math.round((Number(row.points)||0)/max*100))}%"></i><span>${row.event}</span></div>`).join("")}</div><p class="note">Điểm từng Gameweek${past.length?` · ${esc(past[0].season_name)}: ${number(past[0].total_points)} điểm, #${number(past[0].rank)}`:""}</p></div><div class="events">${events.length?events.map(item=>`<div class="event"><b>GW${esc(item.gw)}</b><span>${esc(item.label)}</span><small>${item.meta}</small></div>`).join(""):'<p class="note">Chưa có chuyển nhượng hoặc chip.</p>'}</div></div>`}
    function richText(value){let safe=esc(value||"");safe=safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");return safe.replace(/\n/g,"<br>")}
    function renderData(data){const entry=data.entry||{},gw=data.gameweek||{},chips=(data.chips||[]).length?data.chips.map(chip=>`${chip.name} GW${chip.event}`).join(" · "):"Chưa dùng",basis=gw.squadBasis==="previous_gameweek_before_freehit"?`Đội gốc trước Free Hit GW${number(gw.currentPicksEvent)}`:"15 cầu thủ công khai gần nhất";app.innerHTML=`<section class="kpis"><article class="kpi accent"><span>Free transfer</span>${ftCard(data)}</article><article class="kpi"><span>Gameweek tới</span><strong>GW${number(gw.nextEvent)}</strong><small>${gw.nextDeadline?new Date(gw.nextDeadline).toLocaleString("vi-VN"):"Chưa có deadline"}</small></article><article class="kpi"><span>Overall rank</span><strong>${entry.overallRank?`#${number(entry.overallRank)}`:"–"}</strong><small>${number(entry.totalPoints)} điểm</small></article><article class="kpi"><span>Giá trị đội</span><strong>${money(entry.teamValue)}</strong><small>Bank ${money(entry.bank)}</small></article><article class="kpi"><span>Đội hình nguồn</span><strong>GW${number(gw.advicePicksEvent||gw.picksEvent)}</strong><small>${esc(basis)}</small></article><article class="kpi"><span>Chip đã dùng</span><strong>${(data.chips||[]).length}</strong><small>${esc(chips)}</small></article></section><section class="layout"><div class="main"><article class="panel section" id="squad"><div class="section-head"><div><p class="kicker">MY SQUAD</p><h2>${esc(entry.teamName||"Đội hình FPL")}</h2><p>Đỏ/vàng là cầu thủ có rủi ro; mỗi ô hiển thị chuỗi đối thủ và sân nhà/sân khách.</p></div><span class="badge">${esc(entry.managerName||`FPL #${entry.id}`)}</span></div>${squadBasisNote(data)}${squadView(data)}</article><article class="panel section" id="planner"><div class="section-head"><div><p class="kicker">TRANSFER PLANNER</p><h2>Phương án chuyển nhượng</h2><p>Đúng vị trí, trong ngân sách ước tính và không vượt quá ba cầu thủ mỗi CLB.</p></div><div class="planner-head-actions"><button class="mode ${mode==="safe"?"active":""}" data-mode="safe">An     function bindDynamic(){document.querySelectorAll("[data-mode]").forEach(button=>button.onclick=()=>{mode=button.dataset.mode;renderData(snapshot)});document.querySelectorAll("[data-open-auth]").forEach(button=>button.onclick=openAuth);document.querySelectorAll("[data-prompt]").forEach(button=>button.onclick=()=>{const box=document.getElementById("question");box.value=button.dataset.prompt;box.focus()});const ft=document.getElementById("manualFt");if(ft)ft.onchange=()=>{manualFreeTransfers=ft.value===""?null:Number(ft.value);try{if(manualFreeTransfers===null)localStorage.removeItem(ftStorageKey(snapshot));else localStorage.setItem(ftStorageKey(snapshot),String(manualFreeTransfers))}catch(_){}renderData(snapshot)};const send=document.getElementById("send");if(send)send.onclick=sendQuestion;const question=document.getElementById("question");if(question)question.onkeydown=event=>{if(event.key==="Enter"&&(event.ctrlKey||event.metaKey))sendQuestion()};const messages=document.getElementById("messages");if(messages)messages.scrollTop=messages.scrollHeight}

    function editableBuilderView(data){const state=planState(),stats=builderTransferStats(data),power=transferBuyingPower(),selected=power.selected,position=selected?.player?.position||builderPosition,candidates=(data.market||[]).filter(p=>!plannedSquad.some(x=>Number(x.player?.id)===Number(p.id))).filter(p=>position==="ALL"||p.position===position).filter(p=>!builderQuery||`${p.webName} ${p.team?.name} ${p.team?.shortName}`.toLowerCase().includes(builderQuery.toLowerCase())).sort((a,b)=>Number(b.nowCost||0)-Number(a.nowCost||0)).slice(0,80),market=builderMode==="transfer"?`<div class="market-heading"><h3>Chọn cầu thủ ${esc(position)}</h3><button data-builder-choice="close">Hủy</button></div><div class="market-budget"><span>Giá bán đang tính<b>${money(power.sellingPrice)}</b></span><span>Có thể mua tối đa<b>${money(power.available)}</b></span></div><div class="market-tools"><input id="builderSearch" value="${esc(builderQuery)}" placeholder="Tìm cầu thủ hoặc CLB"><select id="builderPosition" disabled><option>${esc(position)}</option></select></div><div class="market-list">${candidates.map(marketPlayerCard).join("")||'<p class="note">Không tìm thấy cầu thủ phù hợp.</p>'}</div>`:'<div class="builder-idle">Chạm vào một cầu thủ trên sân để chọn <b>Đổi vị trí</b> hoặc <b>Chuyển nhượng</b>. Cầu thủ chấn thương hoặc có nguy cơ vắng mặt được đánh dấu theo trạng thái FPL.</div>';return`<div class="builder-rulebar v11"><div><span>Ngân sách</span><strong>${money(planBudgetLimit)}</strong></div><div><span>Giá trị đội</span><strong>${money(state.value)}</strong></div><div><span>Bank</span><strong>${money(state.bank)}</strong></div><div><span>FT ban đầu</span><strong>${stats.initial===null?"–":stats.initial}</strong></div><div><span>Đã chuyển nhượng</span><strong>${stats.transfers}</strong></div><div class="${stats.remaining!==null&&stats.remaining<0?"negative":"positive"}"><span>FT còn lại</span><strong>${stats.remaining===null?"–":stats.remaining}</strong></div><div class="${stat     function replaceBuilderPlayer(id){const incoming=(snapshot.market||[]).find(p=>Number(p.id)===Number(id)),index=plannedSquad.findIndex(p=>Number(p.player?.id)===Number(builderSelected));if(!incoming||index<0)return;if(plannedSquad.some(p=>Number(p.player?.id)===Number(incoming.id))){planNotice="Cầu thủ này đã có trong đội.";return renderPreservingDraft()}const outgoing=plannedSquad[index].player;if(incoming.position!==outgoing.position){planNotice="FPL yêu cầu thay cầu thủ cùng vị trí.";return renderPreservingDraft()}plannedSquad=plannedSquad.map((p,i)=>i===index?{...p,player:incoming}:p);plannedMoves.push({outPlayer:outgoing,inPlayer:incoming});builderSelected=incoming.id;builderMode="transfer";const state=planState(),warnings=[];if(state.bank<0)warnings.push(`Vượt ngân sách ${money(Math.abs(state.bank))}`);if(state.over.length)warnings.push(`${state.over.length} CLB vượt giới hạn ${planTeamLimit} cầu thủ`);planNotice=warnings.length?`Đã chọn ${incoming.webName}. Cảnh báo: ${warnings.join(" · ")}.`:`Đã chọn ${incoming.webName} thay ${outgoing.webName}. Bạn có thể tiếp tục chọn phương án khác.`;saveBuilder();renderPreservingDraft()}
    function playerActionPopup(selected){if(!selected||builderMode!=="menu")return"";const p=selected.player||{},availability=fplAvailability(p),starter=Number(selected.position)<=11;return`<div class="player-action-backdrop" role="dialog" aria-modal="true" aria-label="Thao tác với ${esc(p.webName)}"><div class="player-action-popup"><header>${clubLogo(p.team)}<div><h3>${esc(p.webName)}</h3><p>${esc(p.team?.name||"")} · ${esc(positionCode[p.position]||p.position)} · ${money(p.nowCost)}</p></div></header>${availability?`<p class="popup-availability ${availability.tone}"><b>${esc(availability.short)}</b><br>${esc(availability.detail)}</p>`:""}<div class="player-action-choices v32"><button data-player-menu-action="arrange">Đổi vị trí<span>Sắp xếp đá chính hoặc dự bị.</span></button><button data-player-menu-action="transfer">Chuyển nhượng<span>Chọn cầu thủ khác cùng vị trí.</span></button><button data-player-menu-action="captain" ${starter?"":"disabled"}>Đội trưởng<span>${starter?"Đặt làm đội trưởng.":"Chỉ áp dụng cho đội hình chính."}</span></button><button data-player-menu-action="vice" ${starter?"":"disabled"}>Đội phó<span>${starter?"Đặt làm đội phó.":"Chỉ áp dụng cho đội hình chính."}</span></button><button class="player-menu-restore" data-player-menu-action="restore">Khôi phục vị trí<span>Đưa cầu thủ ban đầu trở lại vị trí này.</span></button></div><button class="player-action-close" data-player-menu-action="close">Đóng</button></div></div>`}
    function setBuilderRole(role){const pick=plannedSquad.find(p=>Number(p.player?.id)===Number(builderSelected));if(!pick||Number(pick.position)>11){planNotice="Đội trưởng và đội phó phải nằm trong đội hình đá chính.";builderMode="transfer";return renderPreservingDraft()}const starters=plannedSquad.filter(p=>Number(p.position)<=11),other=starters.filter(p=>p!==pick);if(role==="captain"){const preferred=starters.find(p=>p.is_vice_captain&&p!==pick)||starters.find(p=>p.is_captain&&p!==pick)||other[0];plannedSquad.forEach(p=>{p.is_captain=false;p.is_vice_captain=false});pick.is_captain=true;preferred.is_vice_captain=true;planNotice=`Đã chọn ${pick.player.webName} làm đội trưởng và ${preferred.player.webName} làm đội phó.`}else{const preferred=starters.find(p=>p.is_captain&&p!==pick)||starters.find(p=>p.is_vice_captain&&p!==pick)||other[0];plannedSquad.forEach(p=>{p.is_captain=false;p.is_vice_captain=false});preferred.is_captain=true;pick.is_vice_captain=true;planNotice=`Đã chọn ${pick.player.webName} làm đội phó và ${preferred.player.webName} làm đội trưởng.`}builderMode="transfer";saveBuilder();renderPreservingDraft()}
    function restoreBuilderSlot(){const index=plannedSquad.findIndex(p=>Number(p.player?.id)===Number(builderSelected));if(index<0)return;const current=plannedSquad[index],original=(snapshot?.squad||[]).find(p=>Number(p.position)===Number(current.position));if(!original){planNotice="Không tìm thấy cầu thủ ban đầu tại vị trí này.";builderMode="transfer";return renderPreservingDraft()}const currentId=Number(current.player?.id),originalId=Number(original.player?.id);if(currentId===originalId){planNotice=`${original.player.webName} đã là cầu thủ ban đầu ở vị trí này.`;builderMode="transfer";return renderPreservingDraft()}const existingIndex=plannedSquad.findIndex(p=>Number(p.player?.id)===originalId);if(existingIndex>=0&&existingIndex!==index){const displaced=plannedSquad[index].player;plannedSquad[index]={...plannedSquad[index],player:{...original.player}};plannedSquad[existingIndex]={...plannedSquad[existingIndex],player:displaced}}else plannedSquad[index]={...plannedSquad[index],player:{...original.player}};plannedMoves=plannedMoves.filter(m=>Number(m.inPlayer?.id)!==currentId&&Number(m.outPlayer?.id)!==originalId);builderSelected=originalId;builderMode="transfer";planNotice=`Đã khôi phục ${original.player.webName} tại vị trí ban đầu.`;saveBuilder();renderPreservingDraft()}

    function chipPanel(data){const nextGw=Number(data.gameweek?.nextEvent)||1,half=nextGw<=19?1:2;const buttons=chipTypes.map(chip=>{const events=(data.chips||[]).filter(row=>normalizedChip(row.name)===chip.id).map(row=>Number(row.event)).filter(Boolean),usedCurrent=events.some(event=>half===1?event<=19:event>=20),active=builderChip===chip.id;if(usedCurrent&&active)builderChip="none";const status=usedCurrent?`Đã dùng GW${events.find(event=>half===1?event<=19:event>=20)}`:events.length?`Đã dùng GW${events.join(", ")} · Còn lượt nửa ${half}`:`Chưa dùng · Nửa ${half}`;return`<button type="button" class="chip-option ${active?"active":""} ${usedCurrent?"used":""}" data-builder-chip="${chip.id}" ${usedCurrent?"disabled":""}><b>${chip.label}</b><small>${status}</small></button>`}).join("");const rule=builderChip==="freehit"?"Chuyển nhượng không giới hạn cho một GW; đội hình gốc trở lại ở vòng sau. FT đang có được giữ nguyên.":builderChip==="wildcard"?"Chuyển nhượng không giới hạn và đội hình mới được giữ lâu dài. FT đang có được giữ nguyên.":builderChip==="3xc"?"Điểm đội trưởng được nhân ba; quy tắc Free Transfer không thay đổi.":builderChip==="bboost"?"Điểm của bốn cầu thủ dự bị được tính; quy tắc Free Transfer không thay đổi.":"Chuyển nhượng vượt quá số FT hiện có sẽ bị trừ 4 điểm mỗi lượt.";return`<section class="builder-chips"><div class="builder-chips-head"><strong>Chip cho GW${nextGw}</strong><span>Chỉ chọn một chip</span></div><div class="chip-options"><button type="button" class="chip-option ${builderChip==="none"?"active":""}" data-builder-chip="none"><b>Không dùng chip</b><small>Tính FT thông thường</small></button>${buttons}</div><p class="chip-rule">${rule}</p></section>`}
    function builderTransferStats(data){const initialIds=new Set((data?.squad||[]).map(p=>Number(p.player?.id))),transfers=plannedSquad.filter(p=>!initialIds.has(Number(p.player?.id))).length,initial=effectiveFt(data),unlimited=builderChip==="wildcard"||builderChip==="freehit",remaining=initial===null?null:unlimited?initial:initial-transfers,points=unlimited?0:remaining!==null&&remaining<0?remaining*4:0;return{initial,transfers,remaining,points,unlimited,chip:builderChip}}

    async function sendQuestion(){if(chatLoading||!snapshot)return;const box=document.getElementById("question"),message=String(box?.value||"").trim();if(!message)return;const requestMode=advisorMode,liveNews=document.getElementById("liveNews")?.checked!==false,free=effectiveFt(snapshot),advisorContext={...snapshot,squad:plannedSquad,gameweek:{...(snapshot.gameweek||{}),freeTransfersEffective:free},transferPlan:transferPlanContext()},controller=new AbortController(),timer=setTimeout(()=>controller.abort(),54000);chat.push({role:"user",content:message});chatLoading=true;renderData(snapshot);try{const response=await fetch("/api/advisor",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message,context:advisorContext,history:chat.slice(0,-1),liveNews,advisorMode:requestMode}),signal:controller.signal}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||data.error||`HTTP ${response.status}`);const note=data.fallbackReason?`\n\n_Lưu ý: ${data.fallbackReason}_`:"";chat.push({role:"assistant",content:`${data.answer||"Không có nội dung trả lời."}${note}`,advisorMode:data.advisorMode||requestMode,advisorLabel:data.advisorLabel||advisorModeLabel(requestMode),model:data.model||advisorModeModel(requestMode)})}catch(error){const detail=error?.name==="AbortError"?"Yêu cầu đã quá thời gian chờ. Hãy gửi lại hoặc tắt Kiểm tra tin mới trên web.":error.message;chat.push({role:"assistant",content:`Chưa thể tư vấn: ${detail}`})}finally{clearTimeout(timer);chatLoading=false;renderData(snapshot)}}
